<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Quiz Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#10152f,#263b73);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;color:#20294a;width:100%;max-width:600px;padding:28px;border-radius:20px;box-shadow:0 12px 35px #0005}
h1{text-align:center;color:#5548d9;margin-top:0}
.info{display:flex;justify-content:space-between;color:#555;font-weight:bold;margin:20px 0}
#question{font-size:21px;margin:24px 0}
button{cursor:pointer;border:0;border-radius:10px;padding:13px;font-size:16px}
.option{display:block;width:100%;text-align:left;margin:10px 0;background:#eef0ff;color:#20294a;border:2px solid transparent}
.option:hover{border-color:#6658e8}
.option:disabled{cursor:default}
#next,#restart{background:#5548d9;color:white;width:100%;margin-top:15px}
#feedback{text-align:center;font-weight:bold;min-height:24px}
#result{text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>⚡ Tech Quiz Arena</h1>
<div id="game">
<div class="info"><span id="progress">Question 1/10</span><span>⏱️ <span id="timer">15</span>s</span><span>Score: <span id="score">0</span></span></div>
<div id="question"></div>
<div id="options"></div>
<p id="feedback"></p>
<button id="next" onclick="nextQuestion()" disabled>Next Question →</button>
</div>
<div id="result" class="hidden">
<h2>Quiz Completed! 🎉</h2>
<h2 id="finalScore"></h2>
<p id="message"></p>
<button id="restart" onclick="restartQuiz()">Play Again</button>
</div>
</div>
<script>
const questions=[
{q:"Which language is used to structure web pages?",o:["Python","HTML","Java","C++"],a:1},
{q:"What does CPU stand for?",o:["Central Processing Unit","Computer Personal Unit","Central Program Utility","Control Processing User"],a:0},
{q:"Which one is a JavaScript data type?",o:["Number","Website","Keyboard","Browser"],a:0},
{q:"Which data structure follows FIFO?",o:["Stack","Tree","Queue","Graph"],a:2},
{q:"What does CSS control?",o:["Database storage","Web page styling","Computer hardware","Network speed"],a:1},
{q:"Which symbol starts a single-line comment in Java?",o:["<!--","//","##","**"],a:1},
{q:"Which of these is a database?",o:["MySQL","HTML","CSS","Windows"],a:0},
{q:"What is the binary representation of decimal 2?",o:["00","01","10","11"],a:2},
{q:"Which loop checks its condition before each iteration?",o:["while loop","do-while loop only","No loop","None of these"],a:0},
{q:"What does URL stand for?",o:["Universal Record Link","Uniform Resource Locator","Unified Reference List","User Routing Link"],a:1}
];
let index=0,score=0,time=15,interval,answered=false;
function showQuestion(){
answered=false;time=15;
document.getElementById("timer").textContent=time;
document.getElementById("progress").textContent=`Question ${index+1}/${questions.length}`;
document.getElementById("score").textContent=score;
document.getElementById("question").textContent=questions[index].q;
document.getElementById("feedback").textContent="";
document.getElementById("next").disabled=true;
const box=document.getElementById("options");box.innerHTML="";
questions[index].o.forEach((option,i)=>{
const b=document.createElement("button");
b.className="option";b.textContent=String.fromCharCode(65+i)+". "+option;
b.onclick=()=>chooseAnswer(i);
box.appendChild(b);
});
clearInterval(interval);
interval=setInterval(()=>{
time--;document.getElementById("timer").textContent=time;
if(time<=0){clearInterval(interval);if(!answered)chooseAnswer(-1);}
},1000);
}
function chooseAnswer(choice){
if(answered)return;
answered=true;clearInterval(interval);
const q=questions[index];
document.querySelectorAll(".option").forEach((b,i)=>{
b.disabled=true;
if(i===q.a)b.style.background="#c8f7d2";
else if(i===choice)b.style.background="#ffcaca";
});
const feedback=document.getElementById("feedback");
if(choice===q.a){score++;feedback.textContent="Correct! 🎉";feedback.style.color="green";}
else{feedback.textContent=choice===-1?"Time's up!":"Incorrect. Correct answer: "+q.o[q.a];feedback.style.color="#d33";}
document.getElementById("score").textContent=score;
document.getElementById("next").disabled=false;
document.getElementById("next").textContent=index===questions.length-1?"See Result":"Next Question →";
}
function nextQuestion(){
if(!answered)return;
if(index<questions.length-1){index++;showQuestion();}
else{
clearInterval(interval);
document.getElementById("game").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");
document.getElementById("finalScore").textContent=`Your Score: ${score}/${questions.length}`;
document.getElementById("message").textContent=score>=8?"Excellent work! 🌟":score>=5?"Good effort! Keep practising.":"Keep learning and try again!";
}
}
function restartQuiz(){
index=0;score=0;
document.getElementById("result").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
document.getElementById("next").textContent="Next Question →";
showQuestion();
}
showQuestion();
</script>
</body>
</html>
